server.port=${PORT:${SERVER_PORT:8082}}

# --- MongoDB settings ---
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/projectpilot}

# --- JWT settings ---
app.jwt.secret=${JWT_SECRET:ProjectPilotYourAIAssistedGuideToBuildABetterProject}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- File/Upload size limits ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB

# --- Python AI Microservice settings ---
ai.service.url=${AI_SERVICE_URL:http://localhost:8083}
