server.port=8082

# --- MongoDB settings ---
spring.data.mongodb.uri=mongodb://localhost:27017/projectpilot

# --- JWT settings ---
# MUST match auth-service's app.jwt.secret exactly - that shared value is what
# lets this service verify a token it never issued and never calls auth-service to check.
app.jwt.secret=ProjectPilotYourAIAssistedGuideToBuildABetterProject
app.jwt.expiration-ms=3600000

# --- File/Upload size limits ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB

